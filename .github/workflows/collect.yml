name: Recolectar USDT/VES

on:
  # Sin "schedule:": el cron interno de GitHub Actions no es confiable para esta frecuencia
  # (en la práctica llegó a correr cada 5-7 horas en vez de cada hora, sin reportar ningún
  # error — simplemente no se disparaba). En su lugar, un servicio externo gratis llama a la
  # API de GitHub cada hora para disparar este mismo workflow_dispatch manualmente; esas
  # corridas "a pedido" sí son confiables porque no dependen de la cola del trigger schedule.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: recolectar-usdt-ves
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recolectar punto de Binance P2P
        run: python3 collect.py

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add usdt_history.json
          git diff --cached --quiet || git commit -m "Punto $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
